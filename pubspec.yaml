name: getx_project
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: ^3.13.0

dependencies: 
  flutter: 
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  mobile_scanner: ^7.4.2
  hexcolor: ^3.1.3
  google_fonts: ^9.0.0
  get_storage: ^2.1.1
  intl: ^0.20.3
  connectivity_plus: ^7.3.2
  fl_chart: ^1.3.0
  skeletonizer: ^3.0.0
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.4.5
  path: ^1.9.1

dev_dependencies: 
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test: 
    sdk: flutter
  patrol: ^4.10.0

# Patrol E2E tests — run: patrol test -t patrol_test/<file>_test.dart
patrol:
  app_name: Warehouse app
  android:
    package_name: com.example.getx_project
  ios:
    bundle_id: com.example.getxProject

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/

# App launcher icon — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_short.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_adaptive_fg.png"

# Native splash screen — run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo_short.png"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: "assets/images/logo_adaptive_fg.png"

